workers:
  - id: novice_miner
    name: Novice Miner
    description: A beginner miner learning the ropes. Earns XP quickly but has lower efficiency.
    maxLevel: 10
    baseXpPerAction: 10
    xpToLevel: 100
    stats:
      efficiency: 30
      luck: 20
      speed: 50
    cost:
      coins: 100

  - id: seasoned_prospector
    name: Seasoned Prospector
    description: Years of experience make them reliable. Balanced stats across the board.
    maxLevel: 25
    baseXpPerAction: 15
    xpToLevel: 150
    stats:
      efficiency: 50
      luck: 40
      speed: 40
    cost:
      coins: 500

  - id: crystal_specialist
    name: Crystal Specialist
    description: Expert in extracting precious gems. High efficiency but slow to work.
    maxLevel: 50
    baseXpPerAction: 20
    xpToLevel: 200
    stats:
      efficiency: 75
      luck: 30
      speed: 25
    cost:
      coins: 2000

  - id: fortune_seeker
    name: Fortune Seeker
    description: Lucky by nature, they find rare gems more often. Great for discovering legendaries.
    maxLevel: 50
    baseXpPerAction: 18
    xpToLevel: 180
    stats:
      efficiency: 40
      luck: 80
      speed: 45
    cost:
      coins: 3500

  - id: master_gemologist
    name: Master Gemologist
    description: The pinnacle of mining expertise. Maximum efficiency and luck at a premium cost.
    maxLevel: 100
    baseXpPerAction: 25
    xpToLevel: 250
    stats:
      efficiency: 90
      luck: 70
      speed: 60
    cost:
      coins: 10000
