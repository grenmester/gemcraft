# Species (v5.0 model, §12.1). Real diagnostic properties drive Identify (§6);
# suitableCuts / cutDifficulty / phenomena drive Cut (§7).
# Roster derived from docs/research/gem-reference.md (§8 first-iteration set).
#
# Seeded look-alike puzzles across this roster:
#   - Colorless: quartz (7 / 2.65) vs topaz (8 / 3.53) vs sapphire (9 / 4.00) vs diamond (10 / 3.52, RI 2.42)
#   - Red:       ruby (corundum, 9 / 4.00, fluoresces) vs spinel (8 / 3.60, octahedral) vs almandine (7 / 4.05, no fluor)
#   - Purple:    amethyst (7 / 2.65, inert, no cleavage) vs fluorite (4 / 3.18, fluorescent, perfect cleavage)
#   - Green:     emerald (beryl 2.72) vs tsavorite (garnet 3.61) vs peridot (3.34, strong doubling)
#   - Blue:      sapphire (9) vs tanzanite (6.5, pleochroic) vs aquamarine (beryl 2.70)
species:
  # ---- Quartz family (a completable set) ----
