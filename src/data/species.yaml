    luster: vitreous
    transparency: transparent
    colors: [colorless, white]
    streak: white
    fluorescence: null
    refractiveIndex: [1.544, 1.553]
    cleavage: none
    fracture: conchoidal
    baseValue: 5
    suitableCuts: [cabochon, round_brilliant, step]
    cutDifficulty: 1
    realWorldLocations: [Worldwide, Brazil, Arkansas]
    funFact: "Quartz is the most abundant mineral in Earth's continental crust."

